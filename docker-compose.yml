services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      # SQL Server 2022 images ship sqlcmd under mssql-tools18; -C trusts the self-signed cert.
      # Fallback to the legacy path for older images just in case.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123!' -Q 'SELECT 1' -C 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_password123!' -Q 'SELECT 1' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: src/Ballastlane.Api/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=BallastlaneDb;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;"
      Jwt__Secret: "dev-secret-please-replace-in-prod-32chars+"
      Jwt__Issuer: "ballastlane-api"
      Jwt__Audience: "ballastlane-client"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:80"

  web:
    build:
      context: .
      dockerfile: web/ballastlane-web/Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE: "http://localhost:5000/api"
    depends_on:
      - api

# Optional: networks/volumes could be added for persistence
