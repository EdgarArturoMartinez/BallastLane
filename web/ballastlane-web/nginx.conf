server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* requests to the backend API container.
    # React app uses relative path BASE = '/api', so the browser calls
    # http://localhost:5173/api/... — nginx forwards to http://api/api/...
    location /api {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: serve index.html for all client-side routes.
    # Without this, BrowserRouter routes like /tasks return 404 on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
